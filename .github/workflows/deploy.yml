name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        working-directory: /opt/applypilot-discovery
        run: git pull --ff-only origin main

      - name: Rebuild and restart
        working-directory: /opt/applypilot-discovery
        run: docker compose up --build -d
