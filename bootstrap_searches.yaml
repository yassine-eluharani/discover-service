# Bootstrap searches — used ONLY when no users have configured searches yet.
# Once any user has a searches_json config, this file is ignored entirely.

queries:
  - query: "Software Engineer"
  - query: "Software Developer"
  - query: "Full Stack Engineer"
  - query: "Backend Engineer"
  - query: "Frontend Engineer"
  - query: "Machine Learning Engineer"

locations:
  - location: "Remote"
    remote: true

boards:
  - indeed
  - linkedin
  - glassdoor

defaults:
  results_per_site: 50
  hours_old: 48

exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "intern"
  - "internship"
  - "co-op"
  - "clearance required"
  - "TS/SCI"
